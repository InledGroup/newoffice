<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="https://hosted.inled.es/cdn/insuite.svg" />
    <title>Page not found — Insite Office</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --paper: #faf9f8;
        --surface: #fff;
        --line: #e1dfdd;
        --ink: #201f1e;
        --ink-3: #605e5c;
        --accent: #0f6cbd;
        --font: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        text-align: center;
      }
      main {
        max-width: 460px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--ink-3);
        font-size: 14px;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      a:hover {
        filter: brightness(0.97);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page does not exist</h1>
      <p>
        The address may be a leftover from an older version of the site. The editors and your saved documents are one
        click away.
      </p>
      <nav>
        <a class="primary" href="/home">Open the app</a>
        <a href="/">Home</a>
        <a href="/history">Saved documents</a>
      </nav>
    </main>
  </body>
</html>
